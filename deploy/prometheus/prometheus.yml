global:
  scrape_interval: 15s

scrape_configs:
  - job_name: api-v2
    static_configs:
      - targets: [api-v2-1:8000, api-v2-2:8000]
  - job_name: workers
    static_configs:
      - targets: [worker-1:9101, worker-2:9102]
  - job_name: dispatcher
    static_configs:
      - targets: [dispatcher:9103]

rule_files:
  - /etc/prometheus/alerts.yml
