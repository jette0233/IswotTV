worker_processes auto;
events { worker_connections 2048; }

http {
    include /etc/nginx/mime.types;
    log_format json escape=json '{"time":"$time_iso8601","request_id":"$request_id","remote":"$remote_addr","method":"$request_method","uri":"$request_uri","status":$status,"request_time":$request_time}';
    access_log /var/log/nginx/access.log json;
    client_max_body_size 1m;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;

    map $request_method $read_limit_key {
        GET $binary_remote_addr;
        HEAD $binary_remote_addr;
        default "";
    }
    map $request_method $write_limit_key {
        GET "";
        HEAD "";
        default $binary_remote_addr;
    }
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $read_limit_key zone=reads:10m rate=2r/s;
    limit_req_zone $write_limit_key zone=writes:10m rate=30r/m;

    upstream api_v2 {
        least_conn;
        server api-v2-1:8000 max_fails=3 fail_timeout=10s;
        server api-v2-2:8000 max_fails=3 fail_timeout=10s;
    }
    upstream api_v1 { server api-v1:5000; }

    server {
        listen 80;
        server_name _;

        location = /nginx-health { access_log off; return 200 "ok\n"; }
        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;
        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 1d;

        location = /api/v2/auth/login { limit_req zone=login burst=2 nodelay; proxy_pass http://api_v2; include /etc/nginx/proxy_params; }
        location = /api/v2/auth/register { limit_req zone=login burst=2 nodelay; proxy_pass http://api_v2; include /etc/nginx/proxy_params; }
        location /api/v2/producer/events { limit_req zone=writes burst=10 nodelay; proxy_pass http://api_v2; include /etc/nginx/proxy_params; }
        location /api/v2/ {
            limit_req zone=reads burst=30 nodelay;
            limit_req zone=writes burst=10 nodelay;
            proxy_pass http://api_v2;
            include /etc/nginx/proxy_params;
        }
        location /api/v1/ { rewrite ^/api/v1/(.*)$ /api/$1 break; proxy_pass http://api_v1; include /etc/nginx/proxy_params; }
        location /api/ { proxy_pass http://api_v1; include /etc/nginx/proxy_params; }
        location / { proxy_pass http://frontend; include /etc/nginx/proxy_params; }
    }
}
