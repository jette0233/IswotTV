name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: rootpass, MYSQL_DATABASE: chaoxing, MYSQL_USER: chaoxing, MYSQL_PASSWORD: testpass }
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -prootpass"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_USER: chaoxing
      MYSQL_PASSWORD: testpass
      MYSQL_DB: chaoxing
      SECRET_KEY: ci-only-secret-key-at-least-32-characters
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt pip-audit
      - run: python -m compileall -q app v2 migrations
      - run: alembic upgrade head
      - run: pytest
      - run: RUN_INTEGRATION=1 pytest -m integration
      - run: pip check
      - run: pip-audit -r requirements.txt --disable-pip --no-deps

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=high

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp backend/.env.example .env
      - run: docker compose config --quiet
